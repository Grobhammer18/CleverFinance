# Clever Finance — Railway = nur Billing-API (kein Vite-Frontend)
# Frontend: Vercel mit VITE_BILLING_API_URL = diese Railway-URL

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server/billingServer.js"
# Healthcheck optional — bei Fehlern in Railway UI unter Deploy deaktivieren
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
